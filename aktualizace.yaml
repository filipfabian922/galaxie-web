name: Aktualizace webu
on:
  push:
    paths:
      - '.github/workflows/aktualizace.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozbalit a zapsat změny
        run: |
          test -f aktualizace.zip
          unzip -o aktualizace.zip
          rm aktualizace.zip
          git config user.name "Aktualizace webu"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nic k zapsání" || git commit -m "Aktualizace webu: slovenská verze, zaměstnanci SK, nové texty"
          git push
      - name: Spustit publikování webu
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
